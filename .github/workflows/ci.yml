name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: CI only ever needs to read the checkout.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22, 24]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

      # Packs the tarball, installs it into a throwaway project and asserts
      # against that. Runs on every Node version because subpath and condition
      # resolution is exactly what varies between them.
      - run: npm run test:pack -- --no-build

      # Validates the exports map and type resolution across ESM/CJS.
      - run: npm run check:pkg
        if: matrix.node == 20
